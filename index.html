html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;line-height:1.7}
header{padding:18px 16px 8px;max-width:820px;margin:auto}
h1{margin:0;font-size:1.5rem}
header p{margin:4px 0 0;color:var(--mu)}
nav{display:flex;gap:6px;max-width:820px;margin:8px auto;padding:0 16px;overflow-x:auto}
nav button{flex:1;min-width:92px;padding:9px 10px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:820px;margin:auto;padding:8px 16px 40px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:16px;margin:12px 0}
.fr{direction:ltr;text-align:left;unicode-bidi:plaintext}
.opt{display:block;width:100%;text-align:left;direction:ltr;margin:6px 0;padding:10px 12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:8px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,transparent)}
.opt.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 18%,transparent)}
.btn{padding:9px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
.btn.sec{background:var(--ac2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
input{width:130px;direction:ltr}
.exp{margin-top:8px;color:var(--mu);font-size:.95rem}
.bar{height:12px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.fb{margin-top:8px;font-weight:600}
.ok-t{color:var(--ok)}.ko-t{color:var(--ko)}
table{border-collapse:collapse;direction:ltr;font-size:.9rem}
td,th{border:1px solid var(--bd);padding:4px 8px;text-align:center}
code{direction:ltr;unicode-bidi:embed;background:var(--bg);padding:1px 5px;border-radius:4px}
.tag{font-size:.8rem;color:var(--mu)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
</style>
</head>

// ---------- LAB ----------
const D={A:{B:7,C:4,D:10,E:11,F:12},B:{C:2,D:5,E:4,F:11},C:{D:1,E:5,F:10},D:{E:6,F:5},E:{F:3}};
const dist=(a,b)=>a==b?0:(D[a]&&D[a][b])||D[b][a];
const len=t=>t.slice(1).reduce((s,c,i)=>s+dist(t[i],c),0);
function tsp(m){
 const c=el(`<div class="card"><h3>مختبر PVC (Série 2)</h3><p>ابدأ من S0 = B-D-C-A-F-E-B ثم جرّب خوارزميات الجوار: الجوار 2-opt وتأثير درجة الحرارة في التلدين المحاكى.</p>
 <div class="row"><button class="btn" id="n">عدّ الجيران 2-opt</button><button class="btn sec" id="d">نزول (Hill Climbing)</button><label>T0 <input id="t" value="10" type="number"></label><label>μ <input id="u" value="0.9" type="number" step="0.01"></label><button class="btn sec" id="s">تلدين محاكى</button></div><div id="o" class="fr" style="margin-top:10px"></div></div>`);
 m.appendChild(c);const o=c.querySelector("#o");
 const S0=["B","D","C","A","F","E","B"];
 const nb=t=>{const r=[];for(let i=1;i<t.length-2;i++)for(let j=i+1;j<t.length-1;j++){const x=t.slice();const seg=x.slice(i,j+1).reverse();x.splice(i,seg.length,...seg);r.push(x)}return r};
 c.querySelector("#n").onclick=()=>{const r=nb(S0);o.innerHTML=`<b>S0 : ${S0.join("-")} → ${len(S0)}</b><table><tr><th>#</th><th>Solution</th><th>Coût</th></tr>${r.map((x,i)=>`<tr><td>${i+1}</td><td>${x.join("-")}</td><td>${len(x)}</td></tr>`).join("")}</table>`};
 c.querySelector("#d").onclick=()=>{let s=S0,steps=[len(s)];for(;;){const b=nb(s).sort((a,b)=>len(a)-len(b))[0];if(len(b)<len(s)){s=b;steps.push(len(s))}else break}o.innerHTML=`Descente : ${steps.join(" → ")}<br>Optimum local : ${s.join("-")} (coût ${len(s)})`};
 c.querySelector("#s").onclick=()=>{let T=+c.querySelector("#t").value,mu=+c.querySelector("#u").value,s=S0,best=S0,acc=0,wrs=0;while(T>0.05){for(let k=0;k<20;k++){const v=nb(s),n=v[Math.floor(Math.random()*v.length)],dE=len(n)-len(s);if(dE<=0||Math.random()<Math.exp(-dE/T)){if(dE>0)wrs++;s=n;acc++}if(len(s)<len(best))best=s}T*=mu}
  o.innerHTML=`Meilleure tournée : ${best.join("-")} (coût ${len(best)})<br>Transitions acceptées : ${acc}, dont dégradantes : ${wrs}<br><span class="tag">أعد التجربة بـ μ مختلف (0.5 ثم 0.95) لملاحظة أثر سرعة التبريد.</span>`};
}
// ---------- STATS ----------
function stat(m){
 const H=S.hist;if(!H.length){m.appendChild(el(`<div class="card">لا توجد بيانات بعد. أجب عن أسئلة في الكويز أو التمارين لتظهر نتائجك هنا.</div>`));return}
 const agg=(key,labels)=>Object.entries(labels).map(([k,l])=>{const h=H.filter(x=>x[key]==k),n=h.length,g=h.filter(x=>x.ok).length;return `<p>${l} <span class="tag">(${g}/${n})</span><div class="bar"><i style="width:${n?100*g/n:0}%"></i></div></p>`}).join("");
 const tot=H.filter(x=>x.ok).length;
 m.appendChild(el(`<div class="card"><h3>الإجمالي: ${tot} / ${H.length} (${Math.round(100*tot/H.length)}%)</h3></div>`));
 m.appendChild(el(`<div class="card"><h3>حسب الفصل</h3>${agg("ch",CH)}</div>`));
 m.appendChild(el(`<div class="card"><h3>حسب المهارة</h3>${agg("sk",SK)}</div>`));
 const w=Object.entries(CH).map(([k,l])=>{const h=H.filter(x=>x.ch==k);return [l,h.length?h.filter(x=>x.ok).length/h.length:null]}).filter(x=>x[1]!==null).sort((a,b)=>a[1]-b[1])[0];
 if(w)m.appendChild(el(`<div class="card">أضعف فصل حاليًا: <b class="fr">${w[0]}</b> (${Math.round(100*w[1])}%). راجعه ثم أعد الكويز.</div>`));
 const b=el(`<div class="card"><button class="btn sec">مسح النتائج</button></div>`);b.querySelector("button").onclick=()=>{S.hist=[];S.done={};render()};m.appendChild(b);
}
nav();render();
</script>
